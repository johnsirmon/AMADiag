- id: CONN-001
  name: AMCS Endpoint Unreachable
  severity: critical
  category: connectivity
  platforms: [windows, linux]
  description: >
    The agent cannot reach the Azure Monitor Configuration Service (AMCS) endpoints.
    This prevents DCR download and data collection configuration.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(AMCS|global\\.handler\\.control).*(fail|error|timeout|unreachable|refused)"
  remediation: >
    Verify network connectivity to required AMA endpoints. Ensure the following URLs
    are reachable: *.handler.control.monitor.azure.com, *.ingest.monitor.azure.com.
    Check NSG rules, firewalls, and proxy configuration.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-network-configuration

- id: CONN-002
  name: Log Ingestion Endpoint Unreachable
  severity: critical
  category: connectivity
  platforms: [windows, linux]
  description: >
    The agent cannot reach the log ingestion endpoints. Data collection is configured
    but logs/metrics are not being delivered.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(ingestion|ingest\\.monitor).*(fail|error|timeout|unreachable|refused)"
  remediation: >
    Verify connectivity to the data collection endpoint (DCE) configured in the DCR.
    Check that *.ingest.monitor.azure.com is reachable through any firewall or proxy.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-network-configuration

- id: CONN-003
  name: IMDS Endpoint Unreachable
  severity: critical
  category: connectivity
  platforms: [windows, linux]
  description: >
    The Instance Metadata Service (IMDS) at 169.254.169.254 is unreachable.
    AMA requires IMDS for VM identity, authentication tokens, and metadata.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(169\\.254\\.169\\.254|IMDS).*(unreachable|timeout|fail|refused)"
  remediation: >
    IMDS must be accessible from the VM. Do NOT block 169.254.169.254 in local firewall
    rules. For Arc-enabled servers, HIMDS provides equivalent functionality.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-troubleshoot-windows-vm#verify-imds-connectivity

- id: CONN-004
  name: Proxy Configuration Error
  severity: warning
  category: connectivity
  platforms: [windows, linux]
  description: >
    Log entries indicate errors related to proxy configuration. The agent
    may be unable to reach Azure endpoints through the configured proxy.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)proxy.*(fail|error|refused|timeout|unreachable|authentication)"
  remediation: >
    Verify the proxy configuration in /etc/opt/microsoft/azuremonitoragent/proxy.conf
    (Linux) or the agent proxy settings (Windows). Test connectivity through the
    proxy to *.handler.control.monitor.azure.com and *.ingest.monitor.azure.com.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-network-configuration

- id: CONN-005
  name: Azure AD Token Endpoint Unreachable
  severity: critical
  category: connectivity
  platforms: [windows, linux]
  description: >
    The agent cannot reach the Azure AD token endpoint
    (login.microsoftonline.com). Authentication tokens cannot be acquired,
    preventing data upload to Azure Monitor.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(login\\.microsoftonline|aadcdn).*(fail|timeout|refused|unreachable|error)"
  remediation: >
    Verify outbound HTTPS connectivity to login.microsoftonline.com:443.
    Check firewall and NSG rules. If using a proxy, ensure it allows
    Azure AD endpoints.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-network-configuration

- id: CONN-006
  name: HIMDS Endpoint Unreachable (Arc)
  severity: critical
  category: connectivity
  platforms: [windows, linux]
  description: >
    The Hybrid Instance Metadata Service (HIMDS) at localhost:40342 is
    unreachable. Arc-enabled servers require HIMDS for identity and
    token acquisition.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(localhost:40342|HIMDS|hybrid.instance.metadata).*(fail|timeout|refused|unreachable|error)"
  remediation: >
    Verify the Azure Connected Machine Agent is running: azcmagent show.
    Check that the himds service is active. Restart the Arc agent if needed.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-arc/servers/troubleshoot-agent-onboard
