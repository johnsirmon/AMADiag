- id: SYSLOG-001
  name: Syslog Forwarder Not Running
  severity: critical
  category: syslog
  platforms: [linux]
  description: >
    The syslog forwarder (rsyslog or syslog-ng) appears to be stopped or
    not functioning. AMA on Linux relies on the local syslog daemon to
    forward logs to the agent.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(rsyslog|syslog-ng).*(stopped|not.running|inactive|dead|failed)"
  remediation: >
    Start the syslog daemon:
    sudo systemctl start rsyslog
    (or syslog-ng if using syslog-ng)
    Verify it is enabled on boot: sudo systemctl enable rsyslog
  doc_link: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-troubleshooting

- id: SYSLOG-002
  name: Syslog Port Not Listening
  severity: warning
  category: syslog
  platforms: [linux]
  description: >
    The expected syslog forwarding port (typically 28330 for AMA) does not
    appear to be listening based on diagnostic output.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(28330|514).*(not.listening|refused|bind.fail)"
  remediation: >
    Verify the rsyslog/syslog-ng configuration forwards to the correct AMA listening port.
    Check /etc/rsyslog.d/10-azuremonitoragent.conf for the forwarding rule.
    Restart rsyslog after configuration changes.
  doc_link: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-troubleshooting

- id: SYSLOG-003
  name: Syslog Configuration Missing AMA Forwarding
  severity: warning
  category: syslog
  platforms: [linux]
  description: >
    No AMA syslog forwarding configuration file was found (e.g.,
    10-azuremonitoragent.conf in /etc/rsyslog.d/).
  detection:
    file_pattern: "azuremonitoragent"
    condition: file_missing
  remediation: >
    The AMA extension should create the syslog forwarding configuration
    automatically when a syslog data source is configured in the DCR.
    Verify the DCR has a syslog data source and try restarting the AMA extension.
  doc_link: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-troubleshooting

- id: SYSLOG-004
  name: Syslog Ingestion Throttling
  severity: warning
  category: syslog
  platforms: [linux]
  description: >
    The MDSD daemon is throttling syslog ingestion. This occurs when the agent
    receives more syslog data than it can process or upload, typically due to
    high message volume or blocked upload endpoints.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)Throttling ingestion"
  remediation: >
    Investigate data volume — reduce syslog facilities or severities in the DCR
    if the volume is excessive. Check mdsd.warn for throttling frequency.
    Verify connectivity to the log ingestion endpoint.
  doc_link: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-troubleshooting

- id: SYSLOG-005
  name: CEF Collection Upload Failure
  severity: warning
  category: syslog
  platforms: [linux]
  description: >
    The mdsd.qos log shows failures uploading CEF (Common Event Format)
    security data via the SECURITY_CEF_BLOB channel. This indicates CEF
    events are being collected but not reaching Log Analytics.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)SECURITY_CEF_BLOB.*(FailCount|fail|error)"
  remediation: >
    Verify rsyslog is forwarding CEF messages to mdsd on port 28330.
    Check disk space and network connectivity to the ingestion endpoint.
    Compare rsyslog configuration with a known good CEF config.
  doc_link: https://learn.microsoft.com/en-us/azure/sentinel/cef-syslog-ama-troubleshooting
