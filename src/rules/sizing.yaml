- id: SZ-001
  name: Memory Pressure Detected
  severity: warning
  category: sizing
  platforms: [windows, linux]
  description: >
    Log entries indicate the machine is experiencing memory pressure.
    Low available memory can cause AMA to drop events, buffer overflow,
    or agent process crashes.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(out.of.memory|OOM|memory.pressure|low.memory|insufficient.memory)"
  remediation: >
    Ensure the VM has at least 256 MB of free memory for AMA operation.
    Consider upgrading the VM SKU or reducing the number of data collection
    rules and data sources to lower the agent's memory footprint.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-performance

- id: SZ-002
  name: High CPU Usage by AMA
  severity: warning
  category: sizing
  platforms: [windows, linux]
  description: >
    Log entries indicate high CPU utilization by the AMA agent processes.
    This typically occurs on undersized VMs with high data collection volume.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(high.cpu|cpu.throttl|cpu.usage.*9[0-9]%|cpu.usage.*100%)"
  remediation: >
    Consider upgrading the VM to a SKU with more CPU cores, or reducing
    the number and frequency of performance counters being collected.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-performance

- id: SZ-003
  name: Disk Space Low
  severity: warning
  category: sizing
  platforms: [windows, linux]
  description: >
    Log entries indicate disk space issues on the machine. AMA requires
    disk space for its data store, log buffering, and configuration cache.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(disk.full|no.space|insufficient.disk|disk.space)"
  remediation: >
    Free disk space on the partition where AMA stores its data. On Windows this
    is typically C:\\WindowsAzure\\Resources\\AMADataStore. On Linux, check
    /var/opt/microsoft/azuremonitoragent/.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-performance

- id: SZ-005
  name: OOM Killer Terminated Agent Process
  severity: critical
  category: sizing
  platforms: [linux]
  description: >
    The Linux kernel OOM killer terminated an AMA agent process (mdsd or
    amacoreagent). This happens when system memory or the memory cgroup
    limit is exhausted. The agent will restart but may lose buffered data.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(oom-kill|Out of memory.*Killed process).*(mdsd|amacoreagent|azuremonitor)"
  remediation: >
    Upgrade the VM to a SKU with more memory. Reduce the number of DCR
    data sources to lower the agent memory footprint. Check dmesg for
    CONSTRAINT_MEMCG (cgroup limit) vs CONSTRAINT_NONE (system-wide OOM).
    If cgroup-constrained, adjust the systemd MemoryMax setting.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-performance

- id: SZ-006
  name: Memory Cgroup OOM Kill
  severity: critical
  category: sizing
  platforms: [linux]
  description: >
    The kernel OOM killer terminated an AMA process due to a memory cgroup
    limit (CONSTRAINT_MEMCG). This means the systemd MemoryMax or cgroup
    limit for the agent service is too low for the current workload.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)CONSTRAINT_MEMCG.*(mdsd|amacoreagent|azuremonitor)"
  remediation: >
    Increase the systemd MemoryMax setting for the azuremonitoragent
    service, or reduce data collection scope. Check current limit:
    systemctl show azuremonitoragent | grep MemoryMax.
    Edit with: systemctl edit azuremonitoragent and set MemoryMax=.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-performance

- id: SZ-007
  name: Disk Space Full Preventing Upload
  severity: critical
  category: sizing
  platforms: [linux]
  description: >
    The disk is full or nearly full, preventing AMA from writing to its
    spool directory, event cache, or log files. Data collection and upload
    will fail until disk space is freed.
  detection:
    file_pattern: ".log"
    condition: content_match
    content_regex: "(?i)(no space left|ENOSPC|disk full|cannot write).*(spool|events|cache|log)"
  remediation: >
    Free disk space: df -h to check, du -sh /var/opt/microsoft/azuremonitoragent/
    to check agent storage. Clear old spool data if safe. Address the root
    cause (blocked uploads, excessive log volume). Restart AMA after freeing space.
  doc_link: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-performance
